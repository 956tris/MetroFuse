## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Sat Nov 19 15:59:34 CST 2022

org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -XX:+UseG1GC -Dkotlin.daemon.jvm.options="-Xmx4096M"
android.useAndroidX=true
android.enableJetifier=false
# Configuration cache reuses the task graph across builds when inputs are
# unchanged. Build logic must stay compatible: external processes at
# configuration time go through providers.exec (see gitSha in
# app/build.gradle.kts).
org.gradle.configuration-cache=true
# Non-transitive R classes shrink compilation units and improve
# incremental compilation avoidance.
android.nonTransitiveRClass=true

# Jetifier is disabled - no need for ignorelist

# Performance improvements
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configureondemand=false

# The bulk of compile time here is Kotlin + Hilt/Room codegen, keep both incremental.
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
ksp.incremental=true
ksp.incremental.intermodule.metadata=true

# Suppress deprecated warnings
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings,android.nonFinalResIds

# Increase timeouts for JitPack downloads (fixes timeout issues with NewPipeExtractor)
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000

# Build cache reuses task outputs across builds/CI runs. This is unrelated
# to SNAPSHOT dependency metadata caching, so it stays on.
org.gradle.caching=true
