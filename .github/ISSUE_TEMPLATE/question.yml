name: Ask a question
description: Ask about MetroFuse
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        The [MetroFuse user guide](https://github.com/956tris/MetroFuse/blob/main/docs/user-guide.md) covers getting started and using plugins.
  - type: dropdown
    id: device
    attributes:
      label: Device
      multiple: true
      options:
        - Android
        - Android Auto
        - Android TV
        - Windows
        - macOS
        - Linux
  - type: input
    id: version
    attributes:
      label: Version
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Ask your question. You can drag and drop files, screenshots, or videos here.
    validations:
      required: true
