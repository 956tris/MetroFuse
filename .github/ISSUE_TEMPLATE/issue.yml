name: Report a bug
description: Report a problem with MetroFuse
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If a plugin is involved, include its name and version. Remove account details, tokens, and cookies from any logs.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Issues that skip these checks or duplicate an existing issue are closed without a response.
      options:
        - label: I can reproduce this on the [current MetroFuse beta](https://github.com/956tris/MetroFuse/releases).
          required: true
        - label: I searched open and closed issues and found no duplicate.
          required: true
        - label: This issue contains only one bug.
          required: true
        - label: The title describes the bug.
          required: true
        - label: This issue is written in English.
          required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      multiple: true
      options:
        - Android
        - Android Auto
        - Android TV
        - iOS
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Issue
      description: Describe the issue. You can drag and drop files, screenshots, or videos here.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Add the logs here in case of anomalies or crashes.
      render: shell
    validations:
      required: false
