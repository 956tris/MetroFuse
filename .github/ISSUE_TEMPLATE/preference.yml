name: Share a preference
description: Share a preference about MetroFuse
labels: [preference]
body:
  - type: markdown
    attributes:
      value: |
        Tell us which MetroFuse setting or behavior you prefer and how you use it.
  - type: dropdown
    id: device
    attributes:
      label: Device
      multiple: true
      options:
        - Android
        - Android Auto
        - Android TV
        - Windows
        - macOS
        - Linux
  - type: input
    id: version
    attributes:
      label: Version
  - type: textarea
    id: preference
    attributes:
      label: Preference
      description: Explain your preference. You can drag and drop files, screenshots, or videos here.
    validations:
      required: true
