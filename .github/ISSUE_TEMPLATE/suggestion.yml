name: Suggest an improvement
description: Suggest a feature or improvement for MetroFuse
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe what you want to do in MetroFuse and where the current experience gets in the way.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Issues that skip these checks or duplicate an existing issue are closed without a response.
      options:
        - label: This is not already available in the [current MetroFuse beta](https://github.com/956tris/MetroFuse/releases).
          required: true
        - label: I searched open and closed issues and found no duplicate.
          required: true
        - label: This issue contains only one suggestion.
          required: true
        - label: The title describes the suggestion.
          required: true
        - label: This issue is written in English.
          required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      multiple: true
      options:
        - Android
        - Android Auto
        - Android TV
        - Windows
        - macOS
        - Linux
  - type: input
    id: version
    attributes:
      label: Version
  - type: textarea
    id: suggestion
    attributes:
      label: Suggestion
      description: Describe what you would like to change. You can drag and drop files, screenshots, or videos here.
    validations:
      required: true
