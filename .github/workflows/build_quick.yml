name: Quick Test Build

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths-ignore:
      - "README.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/**/*.md"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_quick:
    name: Quick Universal Release Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore release keystore
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.KEYSTORE }}" | base64 -d > app/keystore/release.keystore

      - name: Build Universal Release APK (No Lint)
        run: ./gradlew --console=plain assembleFossRelease -PmetrofuseUniversalApk --warning-mode summary -x lint -x lintFossRelease
        env:
          METROLIST_APP_NAME: MetroFuse Nightly
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Move signed APK
        run: |
          OUTPUT_DIR="app/build/outputs/apk/foss/release"
          mkdir -p "$OUTPUT_DIR/out"
          mv "$OUTPUT_DIR/app-universal-foss-release.apk" "$OUTPUT_DIR/out/MetroFuse-nightly-universal.apk"
          ls -la "$OUTPUT_DIR/out/"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v6
        with:
          name: MetroFuse-nightly
          path: app/build/outputs/apk/foss/release/out/*

      - name: Publish nightly prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd app/build/outputs/apk/foss/release/out
          NOTES="THIS MAY BE BROKEN - INSTALL AT YOUR OWN RISK.

          Automated nightly build from main (${GITHUB_SHA}). Untested, may not even launch."
          gh release delete nightly --cleanup-tag -y || true
          gh release create nightly --prerelease --title "MetroFuse Nightly" --notes "$NOTES" ./*.apk
