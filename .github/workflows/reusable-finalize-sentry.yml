name: Finalize Sentry releases

on:
  workflow_call:
    inputs:
      app-version:
        required: true
        type: string
      version-code:
        required: false
        type: string
        default: ""
    secrets:
      SENTRY_AUTH_TOKEN:
        required: true

env:
  SENTRY_DSN: ${{ vars.SENTRY_DSN }}
  SENTRY_ORG: ${{ vars.SENTRY_ORG }}
  SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
  SENTRY_REPOSITORY: ${{ vars.SENTRY_REPOSITORY }}

jobs:
  finalize-sentry:
    name: Finalize Sentry releases
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Finalize uploaded releases
        shell: bash
        env:
          APP_VERSION: ${{ inputs.app-version }}
          VERSION_CODE: ${{ inputs.version-code }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SENTRY_AUTH_TOKEN" || { echo "SENTRY_AUTH_TOKEN is required" >&2; exit 1; }
          test -n "$SENTRY_ORG"
          test -n "$SENTRY_PROJECT"
          sentry_base="$(python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          dsn = os.environ.get("SENTRY_DSN", "").strip()
          if not dsn:
              print("https://sentry.io")
          else:
              parsed = urlparse(dsn)
              host = parsed.hostname or "sentry.io"
              if host.endswith(".ingest.de.sentry.io") or host == "de.sentry.io":
                  print("https://de.sentry.io")
              elif host.endswith(".ingest.us.sentry.io"):
                  print("https://us.sentry.io")
              elif host.endswith(".ingest.sentry.io"):
                  print("https://sentry.io")
              else:
                  print(f"{parsed.scheme or 'https'}://{host}")
          PY
          )"
          releases=("com.metrofuse.desktop@$APP_VERSION")
          if [[ -n "$VERSION_CODE" ]]; then
            releases+=("com.metrofuse.music@$APP_VERSION+$VERSION_CODE")
          else
            releases+=("com.metrofuse.music@$APP_VERSION")
          fi
          for release in "${releases[@]}"; do
            readarray -t release_data < <(python3 - "$release" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$GITHUB_SHA" <<'PY'
          import json
          import os
          import sys
          from urllib.parse import quote
          print(quote(sys.argv[1], safe=""))
          release = {"version": sys.argv[1], "projects": [os.environ["SENTRY_PROJECT"]]}
          if os.environ.get("SENTRY_REPOSITORY"):
              release["refs"] = [{"repository": os.environ["SENTRY_REPOSITORY"], "commit": sys.argv[3]}]
          print(json.dumps(release, separators=(",", ":")))
          print(json.dumps({"dateReleased": sys.argv[2]}, separators=(",", ":")))
          PY
            )
            encoded_release="${release_data[0]}"
            response="$(mktemp)"
            create_status="$(curl --silent --show-error --retry 3 --connect-timeout 20 --max-time 60 \
              --output "$response" --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary "${release_data[1]}" \
              "$sentry_base/api/0/organizations/$SENTRY_ORG/releases/")"
            [[ "$create_status" == 2* ]] || {
              cat "$response" >&2
              echo "Could not create or find Sentry release $release (HTTP $create_status)" >&2
              exit 1
            }
            finalize_status="$(curl --silent --show-error --retry 3 --connect-timeout 20 --max-time 60 \
              --output "$response" --write-out '%{http_code}' \
              --request PUT \
              --header "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary "${release_data[2]}" \
              "$sentry_base/api/0/organizations/$SENTRY_ORG/releases/$encoded_release/")"
            [[ "$finalize_status" == 2* ]] || {
              cat "$response" >&2
              echo "Could not finalize Sentry release $release (HTTP $finalize_status)" >&2
              exit 1
            }
            rm -f "$response"
          done
